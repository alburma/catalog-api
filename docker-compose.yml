services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - catalog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/catalog
      DB_USER: catalog
      DB_PASSWORD: catalog
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-change-me-64bytes-min}
      JWT_EXP_MIN: "120"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  catalog_pg:
