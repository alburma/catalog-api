spring:
  application:
    name: catalog-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Dev default is obviously fake; prod MUST override JWT_SECRET (enforced at startup).
    secret: ${JWT_SECRET:DEV_ONLY_NOT_FOR_PRODUCTION_________________________________________}
    expiration-minutes: ${JWT_EXP_MIN:60}
    issuer: catalog-api

logging:
  level:
    works.brm.catalog: INFO
    org.springframework.security: WARN
